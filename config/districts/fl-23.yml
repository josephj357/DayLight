# ---------------------------------------------------------------------------
# Data sources — where each layer's data is pulled from. The ingestion scripts
# read this and route accordingly.
# ---------------------------------------------------------------------------
data_sources:
  federal:
    fec:
      base_url: "https://api.open.fec.gov/v1"
      auth: api_key
    congress_gov:
      base_url: "https://api.congress.gov/v3"
      auth: api_key
      note: "Replaces the discontinued ProPublica Congress API (shut down 2024-07-10)."
    opensecrets:
      base_url: "https://www.opensecrets.org/open-data/bulk-data"
      auth: none
      mode: bulk
      license: "CC BY-NC-SA 3.0 US"
      attribution_required: true
      note: "OpenSecrets API discontinued 2025-04-15. Use periodic bulk-data refresh."

  state:
    fl_division_of_elections:
      base_url: "https://dos.fl.gov/elections/candidates-committees/campaign-finance/"
      auth: none
      mode: scrape
      note: "Public records; reformat HTML/CSV exports."

  county:
    broward_soe:
      base_url: "https://www.browardsoe.gov/"
      auth: none
      mode: scrape
      note: "VoterFocus is a vendor UI — scrape the records, not the UI artifacts."

  lobbying:
    senate_lda:
      base_url: "https://lda.senate.gov/api/v1"
      auth: token
      note: "Federal lobbyist disclosure (Senate Office of Public Records)."

# ---------------------------------------------------------------------------
# Methodology knobs (mirrors /docs/methodology.md defaults).
# Adjust per-district if your local political-finance landscape needs it,
# but document the deviation.
# ---------------------------------------------------------------------------
methodology:
  top_n_industries: 5
  min_scored_votes_per_industry: 3
  revolving_door_dollar_threshold: 10000

# DayLight district configuration — FL-23 (reference / v1 default).
#
# This file is the entire description of a district. Drop a copy at
# /config/districts/<your-district>.yml, edit the values, and the rest of
# DayLight picks it up. No code changes required.
#
# All [TODO: verify] markers are deliberate. Confirm against the linked
# primary sources before treating these as authoritative. Florida's 2026
# congressional map is in active litigation (see /docs/research/state-data.md),
# so boundary-dependent fields may need updates if a court issues a stay.

id: fl-23
display_name: "Florida's 23rd Congressional District"
description: >
  Central and northern Broward County, Florida. Includes parts of Pompano Beach,
  Coral Springs, Parkland, Coconut Creek, Tamarac, Sunrise, Plantation, and Davie.

state: FL
fips_state: "12"
plan_id: "fl-cong-2022-sb102"        # 2022 SB 102 plan; pin to whatever is in effect on snapshot_date
snapshot_date: "2026-05-12"
cycle: "2024"                          # active election cycle for v1 ingestion

# ZIP codes the landing page should route to this district. Approximate — voters
# near district boundaries should still confirm via house.gov.
zip_codes:
  - "33060"
  - "33062"
  - "33063"
  - "33064"
  - "33065"
  - "33066"
  - "33067"
  - "33068"
  - "33069"
  - "33071"
  - "33073"
  - "33076"

# ---------------------------------------------------------------------------
# Federal layer — U.S. House race.
# ---------------------------------------------------------------------------
federal:
  - office: "U.S. House"
    level: federal
    district_label: "FL-23"
    cycle: "2024"
    fec_candidate_search:
      state: FL
      district: "23"
    incumbent:
      name: "Jared Moskowitz"
      party: D
      bioguide_id: "M001217"           # verified via Congress.gov 2026-05-12
      fec_candidate_id: "H2FL22171"    # verified via FEC OpenFEC 2026-05-12
      opensecrets_id: "N00046638"      # [TODO: verify against OpenSecrets bulk data]
    sources:
      - label: "FEC candidate page"
        url: "https://www.fec.gov/data/candidates/?search=&state=FL&district=23"
      - label: "Congress.gov member page"
        url: "https://www.congress.gov/member/jared-moskowitz/M001257"

